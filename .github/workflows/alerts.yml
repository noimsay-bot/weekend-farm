# 기상특보·배수점검 즉시 알림용 추가 크론 (Vercel Hobby 크론은 하루 1회라 GitHub Actions로 보완)
# 저장소 Settings > Secrets and variables > Actions에 APP_URL(예: https://weekend-farm.vercel.app), CRON_SECRET 등록
name: weather-alerts
on:
  schedule:
    - cron: "15 */3 * * *" # 3시간마다 (UTC)
  workflow_dispatch:
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call alerts endpoint
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/alerts"
